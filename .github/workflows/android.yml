name: Android CI/CD
# Stable PR identity for recovery when GitHub omits fork run.pull_requests (#1506).
run-name: >-
  ${{ github.event_name == 'pull_request' && format('Android CI PR #{0}', github.event.pull_request.number) || format('Manual Android CI {0}', github.ref_name) }}

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede in-flight checks for the same PR, not other PRs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # A failed template blocks lint/tests but not the contributor's review APK
  # or release compile check.
  # Uses the base branch's copy of the script so a PR cannot weaken its own check.
  # The explanatory bot comment is posted by pr-template.yml.
  # Re-running this job re-reads the current PR body (see the step below).
  # ─────────────────────────────────────────────────────────────────────
  pr-template:
    name: PR Template
    # Repo owner's PRs skip the template gate (skipped counts as pass downstream).
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'Hy4ri'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted script (base branch)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      # Validate the LIVE description, not $GITHUB_EVENT_PATH: a re-run replays the
      # original event payload, so a fixed description could never turn this green.
      - name: Validate PR description
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" \
            | jq --arg repo "$GH_REPO" '{pull_request: ., repository: {full_name: $repo}}' > "$RUNNER_TEMP/event.json"
          python3 .github/scripts/check_pr_template.py "$RUNNER_TEMP/event.json"

  # ─────────────────────────────────────────────────────────────────────
  # Job 0: Detect changes — skips heavy Android build/tests for doc-only PRs
  # ─────────────────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.manual.outputs.code || steps.filter.outputs.code }}
      tooling: ${{ steps.manual.outputs.tooling || steps.filter.outputs.tooling }}
    steps:
      # Inline filters use the PR files API; a manual dispatch runs everything.
      - name: Paths Filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - 'app/**'
              # Theme documentation lives beside Kotlin sources, not assets.
              - '!app/src/main/java/**/*.md'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/android.yml'
              - '.editorconfig'
              - 'flake.nix'
              - 'flake.lock'
            tooling:
              - '.github/scripts/**'
              - '.github/workflows/**'
              - 'scripts/sync-gateway-contract.sh'
      - name: Select all checks for manual runs
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: printf '%s\n' 'code=true' 'tooling=true' >> "$GITHUB_OUTPUT"

  tooling-tests:
    name: Tooling Regression Tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.tooling == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run offline tooling tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  # ─────────────────────────────────────────────────────────────────────
  # Job 1: ktlint (code style) — fastest feedback, runs in parallel.
  # ─────────────────────────────────────────────────────────────────────
  ktlint:
    name: ktlint — Code Style
    needs: [pr-template, changes]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      (needs.pr-template.result == 'success' || needs.pr-template.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Cache ktlint
        id: cache-ktlint
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/ktlint
          key: ktlint-1.8.0

      - name: Install ktlint
        if: steps.cache-ktlint.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
          mv ktlint ~/.local/bin/

      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run ktlintCheck + checkColorLiterals (hardcoded Color guard, issue #622)
        run: ./gradlew ktlintCheck checkColorLiterals --continue

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ktlint-reports
          path: |
            app/build/reports/ktlint/
            build/reports/ktlint/
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 2: Android Lint (static analysis) — runs in parallel with ktlint.
  # Depends on compileDebugKotlin, so it also catches unresolved refs.
  # ─────────────────────────────────────────────────────────────────────
  android-lint:
    name: Android Lint — Static Analysis
    needs: [pr-template, changes]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      (needs.pr-template.result == 'success' || needs.pr-template.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run lintDebug
        run: ./gradlew lintDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 3: Unit tests — runs in parallel with ktlint & android-lint.
  # ─────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit & Integration Tests
    needs: [pr-template, changes]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      (needs.pr-template.result == 'success' || needs.pr-template.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run test
        run: ./gradlew test

      # Telemetry only, never a gate: surfaces the slowest classes so perf work
      # targets real offenders.
      - name: Slowest unit-test classes
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows = []
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(path).getroot()
              rows.append((float(root.get("time", 0)), int(root.get("tests", 0)), root.get("name", path)))
          rows.sort(reverse=True)
          print("### Slowest unit-test classes\n")
          print(f"{len(rows)} classes, {sum(r[0] for r in rows):.0f}s summed across forks\n")
          print("| Time | Tests | Class |\n|---:|---:|---|")
          for secs, count, name in rows[:20]:
              print(f"| {secs:.1f}s | {count} | `{name.rsplit('.', 1)[-1]}` |")
          EOF

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 4: Build Debug APK — runs in parallel; CI Summary gates the result.
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build Debug APK
    # Not gated on pr-template: contributors need the APK to take the screenshots the template asks for.
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build assembleDebug
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: hermescontrol-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 5: Release Compile — verifies release variant compiles.
  # Catches issues like debugImplementation-scoped dependencies that
  # main source code depends on (e.g. okhttp3.logging.HttpLoggingInterceptor).
  # debug-only CI jobs (ktlint, lint, tests) won't catch these.
  # ─────────────────────────────────────────────────────────────────────
  release-compile:
    name: Release Compile Check
    # Not gated on pr-template, same as build: a release-only compile error shows before the template is fixed.
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Compile release Kotlin
        run: ./gradlew compileReleaseKotlin

  # ─────────────────────────────────────────────────────────────────────
  # Job 6: Instrumented tests — runs on Android emulator.
  # Required for Compose UI tests (TEST-09, TEST-14) and Navigation3 tests
  # that need a real Activity lifecycle. Cannot run on JVM.
  # ─────────────────────────────────────────────────────────────────────
  instrumented-tests:
    name: Instrumented Tests
    needs: [pr-template, changes]
    if: >-
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      (needs.pr-template.result == 'success' || needs.pr-template.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTED_KEY }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # Enable KVM hardware acceleration on the Linux runner
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cache the AVD to avoid downloading/recreating it from scratch every time
      - name: AVD Cache
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-atd-x86_64

      - name: Run connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -memory 2048
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: androidTest-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Sole required check. A skip is valid only when the job was not selected.
  # ─────────────────────────────────────────────────────────────────────
  ci-summary:
    name: ${{ github.event_name == 'pull_request' && 'CI Summary' || 'Manual CI Summary' }}
    needs:
      - pr-template
      - changes
      - tooling-tests
      - ktlint
      - android-lint
      - unit-tests
      - build
      - release-compile
      - instrumented-tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check job results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_TEMPLATE_REQUIRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'Hy4ri' && 'true' || 'false' }}
        run: python3 .github/scripts/check_ci_summary.py

  label-ci:
    name: Update CI Label
    needs: ci-summary
    # Fork PR tokens are read-only; the check itself is visible on every PR.
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.ci-summary.result == 'failure' || needs.ci-summary.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        env:
          CI_RESULT: ${{ needs.ci-summary.result }}
        with:
          script: |
            const issue = { ...context.repo, issue_number: context.issue.number };
            const label = 'ci-red';
            const failed = process.env.CI_RESULT === 'failure';
            try {
              if (failed) {
                await github.rest.issues.addLabels({ ...issue, labels: [label] });
              } else {
                await github.rest.issues.removeLabel({ ...issue, name: label });
              }
            } catch (error) {
              if (failed || error.status !== 404) {
                core.warning(`Could not update the CI label: ${error.message}`);
              }
            }
