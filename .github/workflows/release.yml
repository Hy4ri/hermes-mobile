name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sign-release:
    name: Promote and Sign Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate selected tag and version
        id: version
        env:
          SELECTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: python3 .github/scripts/release_version.py "$SELECTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve release source on main
        id: source
        env:
          TAG: ${{ steps.version.outputs.tag }}
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          # Provenance must identify the same source that produces the APK.
          [[ "$RUN_REF" == "refs/tags/$TAG" && "$RUN_SHA" == "$SHA" ]] || {
            echo 'Run this workflow from the selected release tag, not a branch' >&2
            exit 1
          }
          git merge-base --is-ancestor "$SHA" refs/remotes/origin/main
          git checkout --detach "$SHA"
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - name: Find candidate for the exact tagged main commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$(cat release-version.txt)" == "$VERSION" ]] || {
            echo 'Tag does not match release-version.txt at the tagged commit' >&2; exit 1;
          }
          RUN=$(gh api --method GET "repos/$GH_REPO/actions/workflows/android-main-smoke.yml/runs" \
            -f branch=main -f event=push -f status=success -f head_sha="$SOURCE_SHA" -F per_page=1 \
            | jq -r --arg sha "$SOURCE_SHA" --arg repo "$GH_REPO" '
                .workflow_runs[] | select(.head_sha == $sha and .head_branch == "main"
                  and .event == "push" and .conclusion == "success" and .head_repository.full_name == $repo)
                | [.id, .run_attempt] | @tsv')
          if ! IFS=$'\t' read -r RUN_ID ATTEMPT <<< "$RUN" \
            || [[ ! "$RUN_ID" =~ ^[0-9]+$ || ! "$ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo "No successful main candidate run for $SOURCE_SHA. Wait for Android Main Smoke or rerun it, then retry this release." >&2
            exit 1
          fi
          ARTIFACT_NAME="hermes-mobile-release-candidate-$ATTEMPT"
          ARTIFACT_ID=$(gh api --method GET "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
            -f name="$ARTIFACT_NAME" \
            | jq -r --arg name "$ARTIFACT_NAME" '
                .artifacts[] | select(.name == $name and .expired == false) | .id')
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || {
            echo "Release candidate is missing or expired. Rerun Android Main Smoke run $RUN_ID, then retry this release." >&2
            exit 1
          }
          printf 'run-id=%s\nartifact-id=%s\n' "$RUN_ID" "$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "Promoting artifact $ARTIFACT_ID from main run $RUN_ID (attempt $ATTEMPT, $SOURCE_SHA)"

      - name: Download the verified main candidate
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate.outputs.run-id }}
          artifact-ids: ${{ steps.candidate.outputs.artifact-id }}
          path: candidate
          digest-mismatch: error

      - name: Require certificate trust anchor
        env:
          RELEASE_CERTIFICATE_SHA256: ${{ vars.RELEASE_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          CERT="${RELEASE_CERTIFICATE_SHA256//:/}"
          [[ "$CERT" =~ ^[0-9A-Fa-f]{64}$ ]] || {
            echo 'RELEASE_CERTIFICATE_SHA256 must contain the trusted SHA256 certificate fingerprint' >&2
            exit 1
          }

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install signing tools and verify the candidate before signing
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          if [[ ! -x "$BUILD_TOOLS/apksigner" ]]; then
            sdkmanager 'build-tools;37.0.0'
          fi
          APK=candidate/app-release-unsigned.apk
          python3 .github/scripts/verify_release_apk.py --identity-only \
            --apk "$APK" --version-name "$VERSION" --version-code "$CODE" \
            --aapt "$BUILD_TOOLS/aapt"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK"

      - name: Sign the main candidate without rebuilding
        env:
          TAG: ${{ steps.version.outputs.tag }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for NAME in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!NAME}" ]] || { echo "Missing signing secret: $NAME" >&2; exit 1; }
          done
          mkdir -p release
          umask 077
          KEYSTORE=$(mktemp "$RUNNER_TEMP/release-keystore.XXXXXXXX")
          trap 'rm -f -- "$KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          # Keep the same v2-only signature scheme as the previous Gradle release.
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true \
            --v3-signing-enabled false --v4-signing-enabled false \
            --out "release/hermes-mobile-$TAG.apk" \
            candidate/app-release-unsigned.apk

      - name: Verify and prepare release files
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
          RELEASE_CERTIFICATE_SHA256: ${{ vars.RELEASE_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          python3 .github/scripts/verify_release_apk.py \
            --apk "release/hermes-mobile-$TAG.apk" \
            --certificate "$RELEASE_CERTIFICATE_SHA256" \
            --version-name "$VERSION" --version-code "$CODE" \
            --apksigner "$BUILD_TOOLS/apksigner" --aapt "$BUILD_TOOLS/aapt"
          printf 'versionName=%s\nversionCode=%s\n' "$VERSION" "$CODE" > release/version.txt
          (cd release && sha256sum "hermes-mobile-$TAG.apk" version.txt > SHA256SUMS)

      - name: Transfer verified release files
        uses: actions/upload-artifact@v7
        with:
          name: hermes-mobile-release
          path: release/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Attest and Publish Release
    needs: sign-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@v8
        with:
          name: hermes-mobile-release
          path: release

      - name: Verify transferred bytes
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS

      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.sign-release.outputs.tag }}
        run: |
          set -euo pipefail
          # Only a confirmed 404 permits creation. Authentication/network errors fail closed.
          RESPONSE=$(gh api --include "repos/$GH_REPO/releases/tags/$TAG" 2>&1) && {
            echo 'Release already exists; replacement is forbidden' >&2
            exit 1
          }
          if ! grep -q '^HTTP/[^ ]* 404' <<< "$RESPONSE"; then
            printf '%s\n' "$RESPONSE" >&2
            exit 1
          fi

      - name: Attest verified APK
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*.apk

      - name: Stage, verify, and publish release without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.sign-release.outputs.tag }}
          PRERELEASE: ${{ needs.sign-release.outputs.prerelease }}
          SOURCE_SHA: ${{ needs.sign-release.outputs.sha }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$PRERELEASE" == true ]]; then FLAGS+=(--prerelease); fi
          # Keep incomplete uploads private. Existing drafts also require manual recovery.
          gh release create "$TAG" --draft \
            --verify-tag --target "$SOURCE_SHA" --title "$TAG" --generate-notes \
            "${FLAGS[@]}" \
            "release/hermes-mobile-$TAG.apk" release/version.txt release/SHA256SUMS
          mkdir downloaded
          gh release download "$TAG" --dir downloaded \
            --pattern "hermes-mobile-$TAG.apk" --pattern version.txt --pattern SHA256SUMS
          cmp release/SHA256SUMS downloaded/SHA256SUMS
          (cd downloaded && sha256sum --check --strict SHA256SUMS)
          gh release edit "$TAG" --draft=false
