name: PR Auto-Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label by changed files
        uses: actions/labeler@v7
        with:
          dot: true
          sync-labels: false
        # Reads .github/labeler.yml. Additive only (sync-labels: false),
        # so manually-added labels and Dependabot's `dependencies` label
        # are never touched.
